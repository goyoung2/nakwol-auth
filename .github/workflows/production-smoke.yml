name: Production Smoke

on:
  pull_request:
    branches:
      - stable
    paths:
      - 'ops/production-smoke.flag'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Resolve production D1
        run: node scripts/ensure-d1.mjs
      - name: Verify NAKWOL Connect v0.2 schema and registrations
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('auth_operators','application_settings','connect_developers','application_owners','connect_device_requests','connect_cli_tokens') ORDER BY name;" > /tmp/schema.json
          cat /tmp/schema.json
          for table in auth_operators application_settings connect_developers application_owners connect_device_requests connect_cli_tokens; do grep -q "$table" /tmp/schema.json; done
          npx wrangler d1 execute DB --remote --json --command "SELECT client_id,status FROM applications WHERE client_id IN ('nakwol-connect-admin','nakwol-connect-cli','siege-calculator') ORDER BY client_id; SELECT client_id,framework,access_policy FROM application_settings WHERE client_id IN ('nakwol-connect-admin','nakwol-connect-cli','siege-calculator') ORDER BY client_id;" > /tmp/apps.json
          cat /tmp/apps.json
          grep -q 'nakwol-connect-admin' /tmp/apps.json
          grep -q 'nakwol-connect-cli' /tmp/apps.json
          grep -q 'siege-calculator' /tmp/apps.json
          grep -q 'public' /tmp/apps.json
          echo 'NAKWOL_CONNECT_V02_D1_OK'
      - name: Verify production routes and device start
        shell: bash
        run: |
          set -euo pipefail
          origin='https://nakwol-auth.sepsd21.workers.dev'
          for i in {1..18}; do
            admin=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/admin.html -w '%{http_code}' "$origin/admin/apps" || true)
            devs=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/developers.html -w '%{http_code}' "$origin/admin/developers" || true)
            manifest=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/cli-manifest.json -w '%{http_code}' "$origin/connect/cli/manifest.json" || true)
            package=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/connect-cli.tgz -w '%{http_code}' "$origin/connect/cli/package.tgz" || true)
            device=$(curl -sS -H 'Content-Type: application/json' -d '{}' -o /tmp/device.json -w '%{http_code}' "$origin/connect/cli/device/start" || true)
            verify=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/device.html -w '%{http_code}' "$origin/connect/cli/device/verify" || true)
            llms=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/llms.txt -w '%{http_code}' "$origin/llms.txt" || true)
            health=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/health.json -w '%{http_code}' "$origin/api/health" || true)
            echo "attempt=$i admin=$admin devs=$devs manifest=$manifest package=$package device=$device verify=$verify llms=$llms health=$health"
            if [ "$admin" = '200' ] && [ "$devs" = '200' ] && [ "$manifest" = '200' ] && [ "$package" = '200' ] && [ "$device" = '200' ] && [ "$verify" = '200' ] && [ "$llms" = '200' ] && [ "$health" = '200' ]; then
              grep -q 'NAKWOL Connect' /tmp/admin.html
              grep -q '개발자 권한' /tmp/developers.html
              grep -q '"name":"nakwol-connect"' /tmp/cli-manifest.json
              grep -q '"device_code"' /tmp/device.json
              grep -q '"user_code"' /tmp/device.json
              grep -q 'CLI 연결 승인' /tmp/device.html
              grep -q 'npx --yes nakwol-connect init' /tmp/llms.txt
              grep -q '"service":"nakwol-auth"' /tmp/health.json
              test -s /tmp/connect-cli.tgz
              echo 'NAKWOL_CONNECT_V02_ROUTES_OK'
              break
            fi
            sleep 5
          done
          grep -q 'NAKWOL Connect' /tmp/admin.html
      - name: Execute production CLI package
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes --package=https://nakwol-auth.sepsd21.workers.dev/connect/cli/package.tgz -- nakwol-connect help | tee /tmp/cli-help.txt
          grep -q 'NAKWOL Connect CLI v0.2' /tmp/cli-help.txt
          grep -q 'doctor' /tmp/cli-help.txt
          echo 'NAKWOL_CONNECT_V02_PACKAGE_OK'

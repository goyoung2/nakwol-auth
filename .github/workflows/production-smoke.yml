name: Production Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ops/production-smoke.flag'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Resolve production D1
        run: node scripts/ensure-d1.mjs

      - name: Verify NAKWOL Connect schema and registrations
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('auth_operators','application_settings') ORDER BY name;" > /tmp/schema.json
          cat /tmp/schema.json
          grep -q 'auth_operators' /tmp/schema.json
          grep -q 'application_settings' /tmp/schema.json

          npx wrangler d1 execute DB --remote --json --command "SELECT client_id,status FROM applications WHERE client_id='nakwol-connect-admin'; SELECT client_id,framework,access_policy FROM application_settings WHERE client_id IN ('nakwol-connect-admin','siege-calculator') ORDER BY client_id;" > /tmp/apps.json
          cat /tmp/apps.json
          grep -q 'nakwol-connect-admin' /tmp/apps.json
          grep -q 'siege-calculator' /tmp/apps.json
          grep -q 'public' /tmp/apps.json
          echo 'NAKWOL_CONNECT_D1_OK'

      - name: Verify production routes
        shell: bash
        run: |
          set -euo pipefail
          origin='https://nakwol-auth.sepsd21.workers.dev'
          for i in {1..18}; do
            admin=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/admin.html -w '%{http_code}' "$origin/admin/apps" || true)
            manifest=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/connect-manifest.json -w '%{http_code}' "$origin/connect/manifest.json" || true)
            embed=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/connect.js -w '%{http_code}' "$origin/connect/v1.js" || true)
            health=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/health.json -w '%{http_code}' "$origin/api/health" || true)
            echo "attempt=$i admin=$admin manifest=$manifest embed=$embed health=$health"
            if [ "$admin" = '200' ] && [ "$manifest" = '200' ] && [ "$embed" = '200' ] && [ "$health" = '200' ]; then
              if grep -q 'NAKWOL Connect' /tmp/admin.html && \
                 grep -q '"name":"nakwol-connect"' /tmp/connect-manifest.json && \
                 grep -q 'data-client-id is required' /tmp/connect.js && \
                 grep -q '"service":"nakwol-auth"' /tmp/health.json; then
                echo 'NAKWOL_CONNECT_PRODUCTION_OK'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Production smoke failed.'
          echo '--- admin ---'; head -c 1200 /tmp/admin.html || true; echo
          echo '--- manifest ---'; cat /tmp/connect-manifest.json || true; echo
          exit 1

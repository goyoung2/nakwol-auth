name: Production Smoke

on:
  pull_request:
    branches:
      - stable
    paths:
      - 'ops/production-smoke.flag'
      - '.github/workflows/production-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify AUTH v0.2 production surface
        shell: bash
        run: |
          set -euo pipefail
          origin='https://nakwol-auth.sepsd21.workers.dev'
          data_origin='https://nakwol-data.sepsd21.workers.dev'

          ok=0
          for i in {1..18}; do
            health=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/health.json -w '%{http_code}' "$origin/api/health" || true)
            manifest=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/sdk-manifest.json -w '%{http_code}' "$origin/sdk/manifest.json" || true)
            v01=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/sdk-v01.js -w '%{http_code}' "$origin/sdk/v0.1.0/nakwol-auth-web.js" || true)
            v02=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/sdk-v02.js -w '%{http_code}' "$origin/sdk/v0.2.0/nakwol-auth-web.js" || true)
            alias=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/sdk-alias.js -w '%{http_code}' "$origin/sdk/nakwol-auth-web.js" || true)
            account=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/account.html -w '%{http_code}' "$origin/account" || true)
            lab=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/lab.html -w '%{http_code}' "$origin/lab" || true)
            account_api=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/account-api.json -w '%{http_code}' "$origin/account/api/summary" || true)
            lab_api=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/lab-api.json -w '%{http_code}' "$origin/lab/api/diagnostics" || true)
            data_openapi=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/data-openapi.json -w '%{http_code}' "$data_origin/openapi.json" || true)

            echo "attempt=$i health=$health manifest=$manifest v01=$v01 v02=$v02 alias=$alias account=$account lab=$lab account_api=$account_api lab_api=$lab_api data_openapi=$data_openapi"

            if [ "$health" = '200' ] && [ "$manifest" = '200' ] && [ "$v01" = '200' ] && [ "$v02" = '200' ] && [ "$alias" = '200' ] && [ "$account" = '200' ] && [ "$lab" = '200' ] && [ "$account_api" = '401' ] && [ "$lab_api" = '401' ] && [ "$data_openapi" = '200' ]; then
              ok=1
              break
            fi
            sleep 5
          done

          [ "$ok" = '1' ]

          grep -q '"service":"nakwol-auth"' /tmp/health.json
          grep -q '"version":"0.2.0"' /tmp/health.json

          grep -q '"stable":"0.2.0"' /tmp/sdk-manifest.json
          grep -q '"module":"/sdk/v0.2.0/nakwol-auth-web.js"' /tmp/sdk-manifest.json

          grep -q "NAKWOL_AUTH_SDK_VERSION = '0.1.0'" /tmp/sdk-v01.js
          grep -q "NAKWOL_AUTH_SDK_VERSION = '0.2.0'" /tmp/sdk-v02.js
          grep -q 'mountNakwolIdentityMenu' /tmp/sdk-v02.js
          grep -q "NAKWOL_AUTH_SDK_VERSION = '0.2.0'" /tmp/sdk-alias.js

          cmp -s src/assets/nakwol-auth-web.js.txt /tmp/sdk-v01.js
          cmp -s src/assets/nakwol-auth-web-v0.2.0.js.txt /tmp/sdk-v02.js
          cmp -s src/assets/nakwol-auth-web-v0.2.0.js.txt /tmp/sdk-alias.js

          grep -q 'Account Center' /tmp/account.html
          grep -q 'nakwol-account-center' /tmp/account.html
          grep -q '내 낙월 계정' /tmp/account.html

          grep -q 'AUTH LAB' /tmp/lab.html
          grep -q 'nakwol-auth-lab' /tmp/lab.html
          grep -q '진단 권한 없음' /tmp/lab.html

          grep -q 'ACCOUNT_AUTH_REQUIRED' /tmp/account-api.json
          grep -q 'LAB_AUTH_REQUIRED' /tmp/lab-api.json

          grep -q '"openapi":"3.1.0"' /tmp/data-openapi.json
          grep -q '"version":"0.9.0"' /tmp/data-openapi.json

          echo 'NAKWOL_AUTH_V02_PRODUCTION_SMOKE_OK'

name: Repository Governance

on:
  pull_request:
    branches:
      - dev
      - main
      - stable

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce promotion source branch
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "base=$BASE head=$HEAD"
          case "$BASE" in
            dev)
              if [[ "$HEAD" =~ ^(feature|fix|chore|docs)/ ]] || [ "$HEAD" = 'main' ]; then exit 0; fi
              ;;
            main)
              if [ "$HEAD" = 'dev' ] || [ "$HEAD" = 'stable' ] || [ "$HEAD" = 'chore/repository-governance-v1' ]; then exit 0; fi
              ;;
            stable)
              if [ "$HEAD" = 'main' ] || [[ "$HEAD" =~ ^hotfix/ ]] || [[ "$HEAD" =~ ^release/ ]]; then exit 0; fi
              ;;
          esac
          echo "::error::Invalid promotion path: $HEAD -> $BASE"
          exit 1

  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root dependencies
        run: npm install --legacy-peer-deps
      - name: Verify AUTH and Connect
        run: |
          npm test
          npm run typecheck
          npx wrangler deploy --dry-run --outdir .dry-run
      - name: Install DATA dependencies
        working-directory: services/data
        run: npm install --legacy-peer-deps
      - name: Verify DATA
        working-directory: services/data
        run: |
          npm test
          npm run typecheck
          npm run bundle

name: Preflight NAKWOL DATA Deck Integrity

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: ['ops/data-deck-integrity-preflight.flag']

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: services/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install DATA dependencies
        run: npm install --legacy-peer-deps
      - name: Require existing exact DATA D1
        run: node scripts/ensure-d1.mjs
      - name: Read-only duplicate composition scan
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler d1 execute DB --remote --json --command "SELECT gs.deck_id,d.name AS deck_name,d.account_id,ga.nickname AS account_nickname,ga.server_code,gs.general_id,g.name AS general_name,COUNT(*) AS n,GROUP_CONCAT(gs.position) AS positions FROM deck_general_slots gs JOIN decks d ON d.id=gs.deck_id JOIN game_accounts ga ON ga.id=d.account_id LEFT JOIN game_generals g ON g.id=gs.general_id GROUP BY gs.deck_id,d.name,d.account_id,ga.nickname,ga.server_code,gs.general_id,g.name HAVING COUNT(*) > 1 ORDER BY gs.deck_id,gs.general_id;" > /tmp/deck-duplicate-generals.json
          npx wrangler d1 execute DB --remote --json --command "SELECT gs.deck_id,d.name AS deck_name,d.account_id,ga.nickname AS account_nickname,ga.server_code,gs.weapon_instance_id,et.name AS equipment_name,COUNT(*) AS n,GROUP_CONCAT(gs.position) AS positions FROM deck_general_slots gs JOIN decks d ON d.id=gs.deck_id JOIN game_accounts ga ON ga.id=d.account_id LEFT JOIN user_equipment ue ON ue.id=gs.weapon_instance_id LEFT JOIN game_equipment_templates et ON et.id=ue.template_id WHERE gs.weapon_instance_id IS NOT NULL GROUP BY gs.deck_id,d.name,d.account_id,ga.nickname,ga.server_code,gs.weapon_instance_id,et.name HAVING COUNT(*) > 1 ORDER BY gs.deck_id,gs.weapon_instance_id;" > /tmp/deck-duplicate-weapons.json
          npx wrangler d1 execute DB --remote --json --command "SELECT gs.deck_id,d.name AS deck_name,d.account_id,ga.nickname AS account_nickname,ga.server_code,gs.mount_instance_id,et.name AS equipment_name,COUNT(*) AS n,GROUP_CONCAT(gs.position) AS positions FROM deck_general_slots gs JOIN decks d ON d.id=gs.deck_id JOIN game_accounts ga ON ga.id=d.account_id LEFT JOIN user_equipment ue ON ue.id=gs.mount_instance_id LEFT JOIN game_equipment_templates et ON et.id=ue.template_id WHERE gs.mount_instance_id IS NOT NULL GROUP BY gs.deck_id,d.name,d.account_id,ga.nickname,ga.server_code,gs.mount_instance_id,et.name HAVING COUNT(*) > 1 ORDER BY gs.deck_id,gs.mount_instance_id;" > /tmp/deck-duplicate-mounts.json

          node - <<'NODE'
          const fs = require('fs');

          function collectRows(value, key) {
            const rows = [];
            function visit(node) {
              if (!node || typeof node !== 'object') return;
              if (Array.isArray(node)) {
                for (const item of node) visit(item);
                return;
              }
              if (typeof node.deck_id === 'string' && Object.prototype.hasOwnProperty.call(node, key)) {
                rows.push(node);
                return;
              }
              for (const child of Object.values(node)) visit(child);
            }
            visit(value);
            return rows;
          }

          const scans = [
            ['duplicate_general', '/tmp/deck-duplicate-generals.json', 'general_id'],
            ['duplicate_weapon', '/tmp/deck-duplicate-weapons.json', 'weapon_instance_id'],
            ['duplicate_mount', '/tmp/deck-duplicate-mounts.json', 'mount_instance_id'],
          ];

          let total = 0;
          for (const [label, path, key] of scans) {
            const payload = JSON.parse(fs.readFileSync(path, 'utf8'));
            const rows = collectRows(payload, key);
            total += rows.length;
            console.log(`${label}_rows=${rows.length}`);
            for (const row of rows) console.log(`${label}: ${JSON.stringify(row)}`);
          }

          if (total > 0) {
            console.error(`NAKWOL_DECK_INTEGRITY_PREFLIGHT_BLOCKED:duplicate_rows=${total}`);
            process.exit(2);
          }

          console.log('NAKWOL_DECK_INTEGRITY_PREFLIGHT_OK');
          NODE

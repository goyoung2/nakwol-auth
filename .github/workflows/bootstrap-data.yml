name: Bootstrap NAKWOL DATA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ops/data-bootstrap.flag']

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: services/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install DATA dependencies
        run: npm install --legacy-peer-deps
      - name: Verify DATA v0.2
        run: |
          npm test
          npm run typecheck
          npm run bundle
      - name: Resolve or create exact DATA D1
        run: node scripts/ensure-d1.mjs --create-if-missing
      - name: Apply DATA migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Seed DATA Registry
        run: npm run registry:seed:remote
      - name: Verify DATA Registry counts
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --json --command "SELECT (SELECT COUNT(*) FROM game_generals) AS generals,(SELECT COUNT(*) FROM game_generals WHERE enabled=1) AS generals_enabled,(SELECT COUNT(*) FROM game_tactics) AS tactics,(SELECT COUNT(*) FROM game_equipment_templates) AS equipment,(SELECT COUNT(*) FROM game_stat_types) AS stat_types,(SELECT COUNT(*) FROM game_formations) AS formations,(SELECT COUNT(*) FROM game_warbooks) AS warbooks;" > /tmp/data-registry.json
          cat /tmp/data-registry.json
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/data-registry.json', 'utf8'));
          function findCounts(value) {
            if (!value || typeof value !== 'object') return null;
            if (value.generals === 209 && value.generals_enabled === 140) return value;
            for (const child of Object.values(value)) {
              if (Array.isArray(child)) { for (const item of child) { const found = findCounts(item); if (found) return found; } }
              else { const found = findCounts(child); if (found) return found; }
            }
            return null;
          }
          const row = findCounts(payload);
          if (!row || row.tactics !== 1077 || row.equipment !== 134 || row.stat_types !== 281 || row.formations !== 8 || row.warbooks !== 442) {
            console.error('NAKWOL DATA Registry count mismatch', row);
            process.exit(1);
          }
          NODE
          echo 'NAKWOL_DATA_REGISTRY_COUNTS_OK'
      - name: Deploy DATA Worker
        run: npx wrangler deploy --keep-vars
      - name: Verify production DATA v0.2
        shell: bash
        run: |
          set -euo pipefail
          origin='https://nakwol-data.sepsd21.workers.dev'
          for i in {1..12}; do
            health=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/data-health.json -w '%{http_code}' "$origin/api/health" || true)
            schema=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/data-schema.json -w '%{http_code}' "$origin/api/schema" || true)
            echo "attempt=$i health=$health schema=$schema"
            if [ "$health" = '200' ] && [ "$schema" = '200' ] && \
               grep -q '"service":"nakwol-data"' /tmp/data-health.json && \
               grep -q '"version":"0.2.0"' /tmp/data-health.json && \
               grep -q '"schema_version":2' /tmp/data-schema.json; then
              echo 'NAKWOL_DATA_BOOTSTRAP_OK'
              exit 0
            fi
            sleep 5
          done
          echo 'NAKWOL DATA production verification failed.'
          cat /tmp/data-health.json || true
          cat /tmp/data-schema.json || true
          exit 1

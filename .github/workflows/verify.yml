name: Verify NAKWOL AUTH

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'packages/**'
      - 'migrations/**'
      - 'scripts/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'wrangler.jsonc'
      - '.github/workflows/verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Connect CLI package
        run: npm run cli:pack

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle check
        run: npx wrangler deploy --dry-run --outdir .dry-run

      - name: Verify NAKWOL Connect assets
        shell: bash
        run: |
          set -euo pipefail
          grep -q "registerConnectRoutes" src/sdk-entry.ts
          grep -q "registerConnectCliRoutes" src/sdk-entry.ts
          grep -q "registerConnectCliDistributionRoutes" src/sdk-entry.ts
          grep -q "connect/v1.js" src/connect.ts
          grep -q "nakwol-connect-admin" migrations/0003_nakwol_connect.sql
          grep -q "connect_cli_tokens" migrations/0004_nakwol_connect_cli.sql
          grep -q "nakwol-ready" src/assets/nakwol-connect-v1.js.txt
          test -s src/assets/nakwol-connect-cli.tgz.b64.js.txt
          echo 'NAKWOL_CONNECT_STATIC_CHECK_OK'

      - name: Print generated CLI package asset for bootstrap
        if: always()
        shell: bash
        run: |
          if [ -s src/assets/nakwol-connect-cli.tgz.b64.js.txt ]; then
            echo 'CONNECT_CLI_BASE64_BEGIN'
            cat src/assets/nakwol-connect-cli.tgz.b64.js.txt
            echo 'CONNECT_CLI_BASE64_END'
          fi

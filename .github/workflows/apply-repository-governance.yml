name: Apply Repository Governance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require repository admin token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${REPO_ADMIN_TOKEN:-}" ]; then
            echo '::error::REPO_ADMIN_TOKEN secret with repository Administration write permission is required.'
            exit 1
          fi
      - name: Apply dev/main/stable branch protection
        run: node scripts/apply-repository-governance.mjs

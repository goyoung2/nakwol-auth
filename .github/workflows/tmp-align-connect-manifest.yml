name: TEMP Align Connect manifest

on:
  push:
    branches:
      - docs/protected-connect-guide
    paths:
      - '.github/workflows/tmp-align-connect-manifest.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/protected-connect-guide
      - name: Align public Connect manifest and admin fallback
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'src/connect.ts';
          let source = fs.readFileSync(path, 'utf8');
          const before = source;
          source = source.replace(
            "access_policy: row.access_policy ?? 'public',",
            "access_policy: row.access_policy ?? 'member',",
          );
          source = source.replace(
            "    sdk: '/sdk/v0.1.0/nakwol-auth-web.js',\n",
            "    sdk: '/sdk/v0.3.0/nakwol-auth-web.js',\n    default_auth: 'required',\n    default_access_policy: 'member',\n",
          );
          if (source === before) throw new Error('expected Connect manifest/fallback replacements were not applied');
          if (!source.includes("sdk: '/sdk/v0.3.0/nakwol-auth-web.js'")) throw new Error('SDK manifest update missing');
          if (!source.includes("default_auth: 'required'")) throw new Error('default auth missing');
          if (!source.includes("default_access_policy: 'member'")) throw new Error('default policy missing');
          if (!source.includes("access_policy: row.access_policy ?? 'member'")) throw new Error('admin fallback missing');
          fs.writeFileSync(path, source);
          NODE
      - name: Commit source change and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'goyoung2'
          git config user.email '42776733+goyoung2@users.noreply.github.com'
          git add src/connect.ts
          git rm .github/workflows/tmp-align-connect-manifest.yml
          git commit -m 'Align Connect manifest with protected defaults'
          git push origin HEAD:docs/protected-connect-guide

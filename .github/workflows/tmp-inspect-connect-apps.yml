name: TEMP Inspect NAKWOL Connect Apps

on:
  push:
    branches:
      - docs/protected-connect-guide
    paths:
      - '.github/workflows/tmp-inspect-connect-apps.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Resolve production D1 binding
        run: node scripts/ensure-d1.mjs
      - name: Inspect registered applications and access policies
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --json --command "SELECT a.client_id,a.name,a.status,COALESCE(s.homepage_url,'') AS homepage_url,COALESCE(s.access_policy,'<missing>') AS access_policy FROM applications a LEFT JOIN application_settings s ON s.client_id=a.client_id ORDER BY a.client_id;" | tee /tmp/apps.json
      - name: Inspect live external page auth modes
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/apps.json', 'utf8'));
          const rows = payload.flatMap((item) => item.results || []);
          const internal = new Set([
            'nakwol-auth-selftest',
            'nakwol-connect-admin',
            'nakwol-connect-cli',
            'nakwol-account-center',
            'nakwol-auth-lab',
            'nakwol-data-lab',
            'nakwol-data-ops',
            'nakwol-my-data',
          ]);

          (async () => {
            for (const row of rows) {
              if (internal.has(row.client_id) || !/^https?:\/\//.test(row.homepage_url || '')) continue;
              console.log(`=== ${row.client_id} policy=${row.access_policy} url=${row.homepage_url} ===`);
              try {
                const response = await fetch(row.homepage_url, {
                  redirect: 'follow',
                  headers: { 'Cache-Control': 'no-cache', 'User-Agent': 'NAKWOL-Connect-Audit/0.5' },
                });
                const html = await response.text();
                console.log(`http=${response.status}`);
                if (html.includes('nakwol-auth.sepsd21.workers.dev/connect/v1.js')) {
                  console.log('integration=universal-connect');
                  if (/data-auth\s*=\s*["']optional["']/i.test(html)) console.log('auth_mode=OPTIONAL');
                  else if (/data-auth\s*=\s*["']required["']/i.test(html)) console.log('auth_mode=required-explicit');
                  else console.log('auth_mode=required-default');
                  const client = html.match(/data-client-id\s*=\s*["']([^"']+)["']/i)?.[1] || '<missing>';
                  console.log(`page_client_id=${client}`);
                } else if (/nakwol-auth[^"']*sdk\/v0\.[123]/i.test(html)) {
                  console.log('integration=DIRECT_SDK_NO_CONNECT_GUARD');
                } else {
                  console.log('integration=CONNECT_NOT_FOUND_IN_HTML');
                }
              } catch (error) {
                console.log(`fetch_error=${error instanceof Error ? error.message : String(error)}`);
              }
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

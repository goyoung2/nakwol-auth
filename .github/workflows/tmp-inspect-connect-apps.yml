name: TEMP Normalize External Connect Policies

on:
  push:
    branches:
      - docs/protected-connect-guide
    paths:
      - '.github/workflows/tmp-inspect-connect-apps.yml'

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Resolve production D1 binding
        run: node scripts/ensure-d1.mjs
      - name: Normalize known external service policy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --command "UPDATE application_settings SET access_policy='member', updated_at=unixepoch()*1000 WHERE client_id='siege-calculator';"
      - name: Verify all registered external service policies
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --json --command "SELECT a.client_id,a.name,a.status,COALESCE(s.homepage_url,'') AS homepage_url,COALESCE(s.access_policy,'<missing>') AS access_policy FROM applications a LEFT JOIN application_settings s ON s.client_id=a.client_id WHERE a.client_id IN ('cloudflare-deploy-smoke-20260903','deploy','deploy-2','siege-calculator') ORDER BY a.client_id;" | tee /tmp/external-policies.json
          node - <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/external-policies.json','utf8')).flatMap((x) => x.results || []);
          if (rows.length !== 4) throw new Error(`expected 4 external registrations, got ${rows.length}`);
          const bad = rows.filter((row) => row.access_policy !== 'member');
          if (bad.length) throw new Error(`non-member policies remain: ${bad.map((row) => `${row.client_id}=${row.access_policy}`).join(', ')}`);
          for (const row of rows) console.log(`EXTERNAL_POLICY_OK:${row.client_id}:member:${row.homepage_url}`);
          NODE

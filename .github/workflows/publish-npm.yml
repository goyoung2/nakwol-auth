name: Publish NAKWOL Connect CLI to npm

on:
  workflow_dispatch:
  push:
    branches:
      - stable
    paths:
      - 'ops/npm-publish.flag'

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Verify stable PR promotion or stable manual ref
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-stable-promotion.mjs --allow-head main --allow-prefix hotfix/
      - name: Use npm with trusted-publishing support
        run: |
          npm install --global npm@^11.15.0
          node --version
          npm --version
      - name: Install repository dependencies
        run: npm install --legacy-peer-deps
      - name: Full pre-publish verification
        run: |
          npm test
          npm run typecheck
      - name: Inspect package and registry ownership
        shell: bash
        run: |
          set -euo pipefail
          PKG='nakwol-connect'
          VERSION=$(node -p "require('./packages/connect-cli/package.json').version")
          EXPECTED_REPO='https://github.com/goyoung2/nakwol-auth'
          echo "PACKAGE_NAME=$PKG" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo 'PACKAGE_EXISTS=false' >> "$GITHUB_ENV"
          echo 'ALREADY_PUBLISHED=false' >> "$GITHUB_ENV"
          set +e
          npm view "$PKG" name repository.url --json > /tmp/npm-existing.json 2> /tmp/npm-existing.err
          VIEW_STATUS=$?
          set -e
          if [ "$VIEW_STATUS" -eq 0 ]; then
            echo 'PACKAGE_EXISTS=true' >> "$GITHUB_ENV"
            cat /tmp/npm-existing.json
            ACTUAL_REPO=$(node - <<'NODE'
          const fs = require('fs');
          const value = JSON.parse(fs.readFileSync('/tmp/npm-existing.json', 'utf8'));
          const item = Array.isArray(value) ? value[0] : value;
          const repo = item?.['repository.url'] ?? item?.repository?.url ?? '';
          process.stdout.write(repo || '');
          NODE
            )
            normalize_repo() { printf '%s' "$1" | sed -E 's#^git\+##; s#\.git$##; s#/$##'; }
            if [ "$(normalize_repo "$ACTUAL_REPO")" != "$(normalize_repo "$EXPECTED_REPO")" ]; then
              echo "::error::PACKAGE_NAME_TAKEN: npm package '$PKG' already exists and is not owned by this repository."
              exit 1
            fi
          else
            if grep -qiE 'E404|404 Not Found|is not in this registry' /tmp/npm-existing.err; then echo "NPM_PACKAGE_NAME_AVAILABLE:$PKG"; else cat /tmp/npm-existing.err >&2; exit "$VIEW_STATUS"; fi
          fi
          if npm view "$PKG@$VERSION" version --json > /tmp/npm-version.json 2>/dev/null; then
            echo 'ALREADY_PUBLISHED=true' >> "$GITHUB_ENV"
            echo "NPM_VERSION_ALREADY_PUBLISHED:$PKG@$VERSION"
          else
            echo "NPM_VERSION_READY_TO_PUBLISH:$PKG@$VERSION"
          fi
      - name: Require one-time token for first publication
        if: env.ALREADY_PUBLISHED != 'true' && env.PACKAGE_EXISTS != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN:-}" ]; then echo '::error::FIRST_PUBLISH_REQUIRES_NPM_TOKEN'; exit 1; fi
          echo 'NPM_FIRST_PUBLISH_TOKEN_OK'
      - name: First publish with one-time token
        if: env.ALREADY_PUBLISHED != 'true' && env.PACKAGE_EXISTS != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./packages/connect-cli --access public
      - name: Publish existing package with npm Trusted Publishing
        if: env.ALREADY_PUBLISHED != 'true' && env.PACKAGE_EXISTS == 'true'
        env:
          NODE_AUTH_TOKEN: ''
        shell: bash
        run: |
          set -euo pipefail
          echo 'NPM_TRUSTED_PUBLISHING_REQUIRED'
          npm publish ./packages/connect-cli --access public
      - name: Verify registry package and npx execution
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..12}; do
            PUBLISHED=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null || true)
            echo "attempt=$i published=${PUBLISHED:-missing}"
            if [ "$PUBLISHED" = "$PACKAGE_VERSION" ]; then break; fi
            sleep 5
          done
          test "$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version)" = "$PACKAGE_VERSION"
          npm exec --yes --package="$PACKAGE_NAME@$PACKAGE_VERSION" -- nakwol-connect help | tee /tmp/nakwol-connect-help.txt
          CLI_SERIES="${PACKAGE_VERSION%.*}"
          grep -q "NAKWOL Connect CLI v${CLI_SERIES}" /tmp/nakwol-connect-help.txt
          grep -q 'doctor' /tmp/nakwol-connect-help.txt
          grep -q 'data' /tmp/nakwol-connect-help.txt
          echo 'NAKWOL_CONNECT_NPM_PUBLISH_OK'

name: Deploy NAKWOL DATA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ops/data-deploy.flag']

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: services/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install DATA dependencies
        run: npm install --legacy-peer-deps
      - name: Verify DATA foundation
        run: |
          npm test
          npm run typecheck
          npm run bundle
      - name: Require existing exact DATA D1
        run: node scripts/ensure-d1.mjs
      - name: Apply DATA migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy DATA Worker
        run: npx wrangler deploy --keep-vars
      - name: Verify production DATA foundation
        shell: bash
        run: |
          set -euo pipefail
          origin='https://nakwol-data.sepsd21.workers.dev'
          for i in {1..12}; do
            health=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/data-health.json -w '%{http_code}' "$origin/api/health" || true)
            schema=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/data-schema.json -w '%{http_code}' "$origin/api/schema" || true)
            echo "attempt=$i health=$health schema=$schema"
            if [ "$health" = '200' ] && [ "$schema" = '200' ] && \
               grep -q '"service":"nakwol-data"' /tmp/data-health.json && \
               grep -q '"version":"0.1.0"' /tmp/data-health.json && \
               grep -q '"schema_version":1' /tmp/data-schema.json; then
              echo 'NAKWOL_DATA_DEPLOY_OK'
              exit 0
            fi
            sleep 5
          done
          echo 'NAKWOL DATA production verification failed.'
          cat /tmp/data-health.json || true
          cat /tmp/data-schema.json || true
          exit 1

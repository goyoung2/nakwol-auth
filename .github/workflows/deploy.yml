name: Deploy NAKWOL AUTH

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'packages/**'
      - 'migrations/**'
      - 'scripts/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'wrangler.jsonc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Connect CLI package
        run: node scripts/build-connect-cli.mjs

      - name: Unit tests
        run: npm test

      - name: Execute packed Connect CLI
        shell: bash
        run: |
          set -euo pipefail
          tarball=$(find dist/connect-cli -maxdepth 1 -name '*.tgz' | head -n 1)
          npm exec --yes --package="./$tarball" -- nakwol-connect --version | grep -q '^0.2.0$'
          echo 'NAKWOL_CONNECT_CLI_EXEC_OK'

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle check
        run: npx wrangler deploy --dry-run --outdir .dry-run

      - name: Validate Cloudflare CI credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo '::error::Missing repository secret CLOUDFLARE_API_TOKEN'
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo '::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID'
            exit 1
          fi
          npx wrangler d1 list --json > /tmp/d1-auth-check.json
          grep -q 'nakwol-auth' /tmp/d1-auth-check.json
          echo 'CLOUDFLARE_CI_CREDENTIALS_OK'

      - name: Resolve existing NAKWOL AUTH D1
        run: node scripts/ensure-d1.mjs

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Verify required applications
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --json --command "SELECT client_id,status FROM applications WHERE client_id IN ('nakwol-auth-selftest','siege-calculator','nakwol-connect-admin') ORDER BY client_id;" > /tmp/apps.json
          cat /tmp/apps.json
          grep -q 'nakwol-auth-selftest' /tmp/apps.json
          grep -q 'siege-calculator' /tmp/apps.json
          grep -q 'nakwol-connect-admin' /tmp/apps.json

      - name: Deploy existing Worker without replacing dashboard variables
        run: npx wrangler deploy --keep-vars

      - name: Verify production AUTH, SDK and Connect
        shell: bash
        run: |
          set -euo pipefail
          origin='https://nakwol-auth.sepsd21.workers.dev'
          for i in {1..18}; do
            hs=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/health -w '%{http_code}' "$origin/api/health" || true)
            ds=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/demo -w '%{http_code}' "$origin/demo" || true)
            ms=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/manifest -w '%{http_code}' "$origin/sdk/manifest.json" || true)
            ss=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/sdk -w '%{http_code}' "$origin/sdk/v0.1.0/nakwol-auth-web.js" || true)
            cs=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/connect-manifest -w '%{http_code}' "$origin/connect/cli/manifest.json" || true)
            echo "attempt=$i health=$hs demo=$ds sdkManifest=$ms sdk=$ss connectCli=$cs"
            if [ "$hs" = '200' ] && [ "$ds" = '200' ] && [ "$ms" = '200' ] && [ "$ss" = '200' ] && [ "$cs" = '200' ]; then
              if grep -q '"service":"nakwol-auth"' /tmp/health && \
                 grep -q '통합 로그인 자가진단' /tmp/demo && \
                 grep -q '"stable":"0.1.0"' /tmp/manifest && \
                 grep -q "NAKWOL_AUTH_SDK_VERSION = '0.1.0'" /tmp/sdk && \
                 grep -q '"version":"0.2.0"' /tmp/connect-manifest; then
                echo 'NAKWOL_AUTH_INDEPENDENT_DEPLOY_OK'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Independent NAKWOL AUTH verification failed.'
          exit 1
